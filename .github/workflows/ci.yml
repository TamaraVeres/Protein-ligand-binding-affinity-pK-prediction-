name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the CI image small; torch-geometric needs torch present first.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Regenerate the example structures
        # Guards against the committed examples drifting from the generator.
        run: python examples/make_example.py

      - name: Run tests
        run: pytest tests/ -q

      - name: Inference smoke test
        run: |
          python predict.py --csv examples/pairs.csv \
            --model checkpoints/random_run2.pt \
            --output /tmp/predictions.csv
          cat /tmp/predictions.csv
          # Fail if the single example row did not predict successfully.
          python -c "
          import csv, sys
          rows = list(csv.DictReader(open('/tmp/predictions.csv')))
          assert len(rows) == 1, rows
          assert rows[0]['status'] == 'ok', rows[0]
          assert rows[0]['predicted_pK'], rows[0]
          print('inference smoke test OK:', rows[0]['predicted_pK'])
          "
